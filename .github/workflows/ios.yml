name: iOS test ve TestFlight
on:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Testler geçerse TestFlight'a yükle"
        type: boolean
        default: false
      version:
        description: "iOS sürümü"
        default: '1.0.0'
permissions:
  contents: read
concurrency:
  group: izlence-ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Projeyi üret
        run: |
          brew install xcodegen
          xcodegen generate
      - name: iPhone simülatörü seç
        run: |
          python3 scripts/simulator.py >> "$GITHUB_ENV"
      - name: Birim ve iPhone arayüz testleri
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail
          xcodebuild test -project Izlence.xcodeproj -scheme Izlence -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -derivedDataPath build/DerivedData -resultBundlePath build/Izlence.xcresult CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" | tee build-test.log
      - name: Ekran görüntülerini çıkar
        if: always()
        run: |
          if [ -d build/Izlence.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Izlence.xcresult --output-path build/screenshots || true
          fi
      - name: Test raporu ve ekran görüntüleri
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izlence-ios-test-${{ github.run_number }}
          path: |
            build/Izlence.xcresult
            build/screenshots
            build-test.log
          retention-days: 14
  testflight:
    if: inputs.testflight
    needs: test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Projeyi üret
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Sertifikayı yükle ve derle
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          printf '%s' "$DIST_CERT_P12_BASE64" | base64 --decode > dagitim.p12
          DERLEME=$((GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          xcrun agvtool new-marketing-version "$VERSION"
          xcrun agvtool new-version -all "$DERLEME"
          bundle exec fastlane ios testflight_yukle
      - name: Derleme çıktıları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izlence-ios-release-${{ github.run_number }}
          path: |
            build/*.ipa
            build/*.dSYM.zip
            ~/Library/Logs/gym
          retention-days: 7
      - name: Geçici sertifikayı temizle
        if: always()
        run: rm -f dagitim.p12

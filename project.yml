name: Izlence
options:
  bundleIdPrefix: com.kamilsaim
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: NBTXFU47EV
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    VERSIONING_SYSTEM: apple-generic
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Izlence:
    type: application
    platform: iOS
    sources: [Izlence]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kamilsaim.izlence
        INFOPLIST_FILE: Izlence/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  IzlenceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Izlence
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  IzlenceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Izlence
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Izlence:
    build:
      targets:
        Izlence: all
    test:
      targets: [IzlenceTests, IzlenceUITests]
